# project.yml — XcodeGen specification for CORTEX iOS app.
# Generate the Xcode project with: xcodegen generate
# Requires: brew install xcodegen

name: Cortex
options:
  bundleIdPrefix: dev.moyosore.cortex
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  Cortex:
    type: application
    platform: iOS
    sources:
      - path: Cortex
    info:
      path: Cortex/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moyosore.cortex
        INFOPLIST_FILE: Cortex/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
